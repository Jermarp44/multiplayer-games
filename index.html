<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiplayer Games Lab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Arcade Collection</p>
          <h1>Multiplayer Games Lab</h1>
        </div>
        <div class="status-pill">8 game prototypes</div>
      </header>

      <section class="games-grid" id="gamesGrid"></section>

      <section class="stage-panel">
        <div class="stage-header">
          <h2 id="stageTitle">Select a game</h2>
          <button id="resetGameBtn" class="secondary-button">Reset Demo</button>
        </div>
        <div id="gameStage" class="game-stage empty-state">
          <div class="empty-copy">
            <h3>Choose a game prototype</h3>
            <p>
              Explore a collection of eight multiplayer-inspired browser games built as
              lightweight playable demos.
            </p>
          </div>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
